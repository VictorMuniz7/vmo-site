    <!--
      Tema antes da primeira pintura.

      Este script precisa ser síncrono e ficar aqui, no <head>: se a escolha do
      tema esperasse o Angular hidratar, quem prefere o claro veria o site
      escuro piscar antes. O hash SHA-256 dele é calculado no passo de build
      (scripts/aplicar-csp.mjs) e entra na CSP — nada de `unsafe-inline`.
    -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('vmo-tema');
          var tema =
            salvo === 'light' || salvo === 'dark'
              ? salvo
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', tema);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', tema === 'dark' ? '#061417' : '#f4fafb');
        } catch (e) {
          /* armazenamento bloqueado: segue no tema escuro do atributo */
        }
      })();
    </script>
